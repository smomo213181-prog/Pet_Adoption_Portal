<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws Home Signup</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="left">
        <div class="overlay"></div>

        <div class="left-text">
          <h1>Every story deserves a beautiful chapter.</h1>
          <p>Join our community and help pets find loving homes.</p>
        </div>
      </div>

      <div class="right">
        <div class="form-box">
          <h3>Paws Home</h3>

          <h1>Create your account</h1>
          <p class="subtitle">
            Start your journey toward finding or rehoming a friend.
          </p>

          <form id="signupForm">
            <div class="row">
              <div class="input-group">
                <label>FIRST NAME</label>
                <input type="text" placeholder="Alex" required />
              </div>

              <div class="input-group">
                <label>LAST NAME</label>
                <input type="text" placeholder="Rivera" required />
              </div>
            </div>

            <div class="input-group">
              <label>EMAIL ADDRESS</label>
              <input type="email" placeholder="alex@example.com" required />
            </div>

            <div class="input-group password-box">
              <label>PASSWORD</label>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
              />
              <span onclick="togglePassword()">👁</span>
            </div>

            <div class="check-box">
              <input type="checkbox" id="agree" required />
              <label for="agree">
                I agree to the <a href="#">Terms of Service</a> and
                <a href="#">Privacy Policy</a>.
              </label>
            </div>

            <button type="submit" class="create-btn">
              Create Account <span>→</span>
            </button>
          </form>

          <p class="signin-text">
            Already have an account?<br />
            <a href="#">Sign In</a>
          </p>

          <div class="divider">
            <span>SOCIAL SIGNUP</span>
          </div>

          <div class="social">
            <button><b>G</b> Google</button>
            <button><b>f</b> Facebook</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
